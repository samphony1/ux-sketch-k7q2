<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Protected preview</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--tx:#2b2724;--mut:#7a726b;--line:#d9d3cb;--acc:#d9531e;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1c2229;--tx:#e6eaee;--mut:#8b96a1;--line:#2c353f;--acc:#3ad6e6;--err:#ff7a70}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px 22px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{font-size:17px;margin:0 0 4px;font-weight:650}
p{margin:0 0 16px;color:var(--mut);font-size:13.5px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--tx)}
input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border-radius:9px;border:0;background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#06222a}}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--err)}
noscript{display:block;color:var(--err);font-size:13px;margin-top:10px}
</style>
</head>

  </form>

const b=x=>Uint8Array.from(atob(x),ch=>ch.charCodeAt(0));
async function decrypt(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c)));
}
async function unlock(pw){
  let html;try{html=await decrypt(pw)}catch(e){return false}
  try{sessionStorage.setItem('pv',pw)}catch(e){}   // keeps this tab unlocked across a reload
  document.open();document.write(html);document.close();return true;
}
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),msg=document.getElementById('msg');
if(!window.crypto||!crypto.subtle){msg.textContent='This browser cannot unlock it (it needs a secure https page).';go.disabled=true}
f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';go.disabled=true;go.textContent='Unlocking…';
  const ok=await unlock(pw.value);
  if(!ok){go.disabled=false;go.textContent='Open';msg.textContent='That password is not right.';pw.select()}});
(async()=>{let s=null;try{s=sessionStorage.getItem('pv')}catch(e){}if(s&&window.crypto&&crypto.subtle){if(!(await unlock(s))){try{sessionStorage.removeItem('pv')}catch(e){}}}})();
